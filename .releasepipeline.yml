versioning:
  strategy: independent
  source: git-tags
  defaultBump: minor

runtime:
  operatingSystem: windows
  scripting: pwsh

validation:
  setup:
    command: pnpm install --frozen-lockfile
  containerSmoke:
    component: api
    path: /weatherforecast
    containerPort: 8080
    environment:
      ASPNETCORE_URLS: http://+:8080

watchPaths:
  [
    pnpm-lock.yaml,
    pnpm-workspace.yaml,
    package.json,
    .releasepipeline.yml,
    eng/ci,
  ]

# Standard GitHub approval/configuration boundaries. Installation stays manual.
# Future deployment targets must consume the verified manifest without rebuilding.
environments:
  DEV: {}
  QA: {}
  PROD: {}

components:
  web:
    path: apps/web
    watchPaths: [packages/shared]
    type: node
    tagPrefix: web
    build:
      command: pnpm --filter ./apps/web build
    test:
      command: pnpm --filter ./apps/web lint
    validation:
      command: pnpm build-web
    package:
      path: apps/web/dist
  api:
    path: apps/api
    type: modern-dotnet
    tagPrefix: api
    build:
      command: dotnet publish ./apps/api -c Release -o .release-output/api
    validation:
      command: dotnet build ./apps/api -c Release
    package:
      path: .release-output/api
    publishing:
      adapter: container
      image: ghcr.io/agent0x21/pipeline-template-3-api
      dockerfile: apps/api/Dockerfile
      context: .
      oidc: true
    dependencies: []
  desktop:
    path: apps/desktop
    type: modern-dotnet-windows
    tagPrefix: desktop
    build:
      command: dotnet publish ./apps/desktop -c Release -o .release-output/desktop
    validation:
      command: dotnet build ./apps/desktop -c Release
    package:
      path: .release-output/desktop
