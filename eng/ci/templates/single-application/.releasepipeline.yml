# Copy to <repository-root>/.releasepipeline.yml and replace the example values.
versioning:
  strategy: independent
  source: git-tags
  defaultBump: minor

runtime:
  operatingSystem: windows
  scripting: pwsh

environments:
  DEV: {}
  QA: {}
  PROD: {}

components:
  app:
    path: apps/app
    type: node
    tagPrefix: app
    build:
      command: pnpm --filter ./apps/app build
    test:
      command: pnpm --filter ./apps/app test
    package:
      path: apps/app/dist
