name: Promote Release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run ID containing the release artifact
        required: true
        type: string
      target_channel:
        description: Promotion target channel
        required: true
        type: choice
        options: [rc, stable]

permissions:
  actions: read
  contents: write

concurrency:
  group: "promotion-${{ inputs.target_channel }}"
  cancel-in-progress: false

jobs:
  promote:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install YAML parser
        shell: pwsh
        run: Install-Module powershell-yaml -Scope CurrentUser -Force
      - name: Download immutable source artifact
        uses: actions/download-artifact@v7
        with:
          name: "release-${{ inputs.source_run_id }}"
          run-id: "${{ inputs.source_run_id }}"
          github-token: "${{ github.token }}"
          path: source-artifacts
      - name: Plan promotion
        shell: pwsh
        run: .\eng\ci\New-ArtifactPromotionPlan.ps1 -ProvenancePath .\source-artifacts\provenance.json -TargetChannel '${{ inputs.target_channel }}'
      - name: Create promotion tags
        shell: pwsh
        run: .\eng\ci\Invoke-ArtifactPromotion.ps1 -PlanPath .\promotion-plan.json -Push
      - name: Upload promotion record
        uses: actions/upload-artifact@v7
        with:
          name: "promotion-${{ inputs.source_run_id }}-${{ inputs.target_channel }}-${{ github.run_id }}"
          path: |
            source-artifacts/
            promotion-provenance.json
          retention-days: 30
      - name: Publish GitHub release metadata
        shell: pwsh
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: .\eng\ci\providers\github\Publish-GitHubReleaseMetadata.ps1 -PlanPath .\promotion-plan.json
