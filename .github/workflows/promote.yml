# Recovery path: redeploy an already-approved release identity.
#
# Normal promotion is automatic and lives in release.yml. This workflow exists for
# recovery only - for example a QA or production deployment that failed after the
# artifact was approved. It re-deploys the exact digest recorded by that run. It
# never builds, never re-versions, and never moves a source branch.
name: Redeploy Approved Release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Release Candidate run ID that produced the approved release
        required: true
        type: string
      target_environment:
        description: Environment to redeploy to
        required: true
        type: choice
        options: [qa, production]

permissions:
  actions: read
  contents: read

concurrency:
  group: "redeploy-${{ inputs.target_environment }}"
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: self-hosted
    timeout-minutes: 30
    environment: ${{ inputs.target_environment }}
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install release engine dependencies
        shell: pwsh
        run: Install-Module powershell-yaml -Scope CurrentUser -Force
      - name: Prove this job is not building the application
        shell: pwsh
        run: .\eng\ci\Assert-NoApplicationBuild.ps1
      - name: Download the persisted release identity
        uses: actions/download-artifact@v7
        with:
          name: "release-manifest-${{ inputs.source_run_id }}"
          run-id: "${{ inputs.source_run_id }}"
          github-token: "${{ github.token }}"
          path: release-identity
      - name: Download the QA-approved release identity
        uses: actions/download-artifact@v7
        with:
          name: "approved-release-${{ inputs.source_run_id }}"
          run-id: "${{ inputs.source_run_id }}"
          github-token: "${{ github.token }}"
          path: approved-release
      - name: Authenticate to GitHub Container Registry
        uses: ./.github/actions/ghcr-login
        with:
          actor: "${{ github.actor }}"
          token: "${{ github.token }}"
      - name: Redeploy the approved digest
        shell: pwsh
        env:
          TARGET_ENVIRONMENT: "${{ inputs.target_environment }}"
        run: |
          .\eng\ci\Invoke-EnvironmentDeployment.ps1 `
            -ManifestPath .\release-identity\release-manifest.json `
            -ApprovedManifestPath .\approved-release\approved-release-manifest.json `
            -Environment $env:TARGET_ENVIRONMENT -RequireApprovedRelease -PublishAlias
      - name: Upload the redeployment record
        uses: actions/upload-artifact@v7
        with:
          name: "redeployment-${{ inputs.target_environment }}-${{ github.run_id }}"
          path: "deployment-${{ inputs.target_environment }}.json"
          retention-days: 90
