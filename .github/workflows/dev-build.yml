name: DEV Artifacts
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: main or a full commit SHA reachable from main
        type: string
        default: main
      components:
        description: Comma-separated components; empty builds all
        type: string
        default: ''
      push_image:
        description: Publish the API development image
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: dev-artifacts
  cancel-in-progress: false
defaults:
  run:
    shell: pwsh
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 60
    environment:
      name: DEV
      deployment: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Enable Windows long paths
        run: git config --global core.longPaths true
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-release
        with:
          build: 'true'
          tests: 'true'
      - name: Resolve main commit
        id: source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          Import-Module ./eng/ci/ReleasePipeline/ReleasePipeline.psd1 -Force
          $source = Resolve-ReleaseSource -SourceRef $env:SOURCE_REF -Intent dev
          "sha=$($source.sha)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Test release tooling
        run: ./eng/ci/Invoke-ReleasePipelineTests.ps1
      - name: Install source dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/ghcr-login
        if: inputs.push_image
        with:
          actor: ${{ github.actor }}
          token: ${{ github.token }}
      - name: Build development artifacts
        working-directory: source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          COMPONENTS: ${{ inputs.components }}
          PUSH_IMAGE: ${{ inputs.push_image }}
        run: |
          $components = @($env:COMPONENTS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          ../eng/ci/Invoke-DevelopmentBuild.ps1 -ConfigPath ../.releasepipeline.yml -ExpectedSha $env:SOURCE_SHA -Branch main -Component $components -Push:($env:PUSH_IMAGE -eq 'true')
      - uses: actions/upload-artifact@v7
        with:
          name: dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/dev-artifacts/
            source/development-build.json
          retention-days: 7
          if-no-files-found: error
      - name: Summarize
        run: |
          "## DEV artifacts prepared`n`nSource: [``${{ steps.source.outputs.sha }}``](${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.source.outputs.sha }})`n`nDownload this run's artifacts for manual installation. No deployment or release tags were created." >> $env:GITHUB_STEP_SUMMARY
