name: DEV Artifacts
run-name: >-
  DEV artifacts • ${{ inputs.source_ref }} • ${{ inputs.components || 'all components' }} • image=${{ inputs.push_image }}
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: main or a full commit SHA reachable from main
        type: string
        default: main
      components:
        description: Comma-separated components; empty builds all
        type: string
        default: ""
      push_image:
        description: Publish configured development container images
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: dev-artifacts
  cancel-in-progress: false
defaults:
  run:
    shell: pwsh
jobs:
  build:
    name: Build DEV artifacts
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 60
    environment:
      name: DEV
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Enable Windows long paths
        run: git config --global core.longPaths true

      - name: Checkout workflow tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up release tooling
        uses: ./.github/actions/setup-release
        with:
          build: "true"
          tests: "true"

      - name: Resolve main commit
        id: source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          Import-Module ./eng/ci/ReleasePipeline/ReleasePipeline.psd1 -Force
          $source = Resolve-ReleaseSource -SourceRef $env:SOURCE_REF -Intent dev
          "sha=$($source.sha)" >> $env:GITHUB_OUTPUT

      - name: Summarize build request
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          COMPONENTS: ${{ inputs.components }}
          PUSH_IMAGE: ${{ inputs.push_image }}
        run: |
          $components = if ([string]::IsNullOrWhiteSpace($env:COMPONENTS)) {
            'All components'
          } else {
            $env:COMPONENTS
          }

          @"
          ## DEV artifact build

          | Setting | Value |
          | --- | --- |
          | Source ref | ``$env:SOURCE_REF`` |
          | Resolved commit | [``$env:SOURCE_SHA``](${{ github.server_url }}/${{ github.repository }}/commit/$env:SOURCE_SHA) |
          | Components | ``$components`` |
          | Publish container images | ``$env:PUSH_IMAGE`` |
          | Environment | ``DEV`` |
          | Triggered by | @${{ github.actor }} |
          | Run | #${{ github.run_number }} · attempt ${{ github.run_attempt }} |

          ### Status

          🔄 Building development artifacts…

          A DEV artifact-handoff record will link to this run; no application installation or release tags will be created.
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Test release tooling
        run: ./eng/ci/Invoke-ReleasePipelineTests.ps1

      - name: Set up configured source dependencies
        working-directory: source
        run: ../eng/ci/Invoke-ConfiguredValidation.ps1 -ConfigPath ../.releasepipeline.yml -SetupOnly

      - name: Authenticate to GHCR
        uses: ./.github/actions/ghcr-login
        if: inputs.push_image
        with:
          actor: ${{ github.actor }}
          token: ${{ github.token }}

      - name: Build development artifacts
        working-directory: source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          COMPONENTS: ${{ inputs.components }}
          PUSH_IMAGE: ${{ inputs.push_image }}
        run: |
          $components = @($env:COMPONENTS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          ../eng/ci/Invoke-DevelopmentBuild.ps1 -ConfigPath ../.releasepipeline.yml -ExpectedSha $env:SOURCE_SHA -Branch main -Component $components -Push:($env:PUSH_IMAGE -eq 'true')

      - name: Upload DEV artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/dev-artifacts/
            source/development-build.json
          retention-days: 7
          if-no-files-found: error

      - name: Summarize result
        if: always()
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_NAME: dev-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $source = if ([string]::IsNullOrWhiteSpace($env:SOURCE_SHA)) {
            'Unavailable (source resolution did not complete)'
          } else {
            "[``$env:SOURCE_SHA``](${{ github.server_url }}/${{ github.repository }}/commit/$env:SOURCE_SHA)"
          }

          $status = switch ($env:JOB_STATUS) {
            'success' { '✅ Development artifacts were prepared successfully.' }
            'failure' { '❌ Development artifact generation did not complete successfully.' }
            'cancelled' { '⏹️ Development artifact generation was cancelled.' }
            default { "Status: ``$env:JOB_STATUS``" }
          }

          @"
          ## Build result

          **Source:** $source

          **Result:** ``$env:JOB_STATUS``

          $status

          **Artifact:** ``$env:ARTIFACT_NAME``  
          **Retention:** 7 days

          This environment deployment record represents the DEV artifact handoff only. Download this run's artifacts for manual installation; no release tags were created.
          "@ >> $env:GITHUB_STEP_SUMMARY
