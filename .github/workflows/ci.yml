name: CI
on:
  push:
    branches: [main, 'feature/**', 'bugfix/**', 'hotfix/**', 'release/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: pwsh
jobs:
  validate:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 45
    steps:
      - name: Enable Windows long paths
        run: git config --global core.longPaths true
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-release
        with:
          build: 'true'
          tests: 'true'
      - name: Validate release engine and workflows
        run: ./eng/ci/Invoke-ReleasePipelineTests.ps1
      - name: Validate configured components
        run: ./eng/ci/Invoke-ConfiguredValidation.ps1 -ConfigPath .releasepipeline.yml
